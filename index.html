<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiet Pocket Studio</title>
<style>
:root{color-scheme:light dark;--bg:#FFF8F0;--fg:#2B2340;--muted:#6B6480;--line:#EADFD3;--accent:#E8624D;--mark:#FFE9A8}
@media (prefers-color-scheme:dark){:root{--bg:#1D1829;--fg:#F1ECF8;--muted:#B7AECB;--line:#3A3350;--accent:#FF9C86;--mark:#5A4A12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left)) 64px}
nav{display:flex;gap:8px;margin-bottom:24px}
nav a{padding:8px 16px;border-radius:999px;border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:600}
nav a.on{background:var(--accent);border-color:var(--accent);color:#fff}
h1{font-size:1.7rem;line-height:1.25;margin:0 0 16px}
h2{font-size:1.15rem;margin:32px 0 8px}
p,li{margin:8px 0} ul{padding-left:1.2em}
a{color:var(--accent)}
mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 3px}
.tw{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
section{display:none} section:target,#ru-default{display:block}
</style></head><body><main>
<h1>Quiet Pocket Studio</h1>
<p>Small, calm apps for families.</p>
<p><a href="playpocket/">playpocket</a>: ideas for kids under 3 · идеи для детей до 3 лет</p>
<p><a href="mailto:quietpocketstudio@gmail.com">quietpocketstudio@gmail.com</a></p>
</main></body></html>
